# video_forward 插件配置示例
# 复制到 NekroAgent 的插件配置里，或作为 plugin_data/local_video.video_forward/config.yaml 的模板

# NapCat 访问 NekroAgent 的地址（不带 /webui 后缀）
public_base_url: "http://1.2.3.4:8022"

# 单个视频/图片体积上限（MB）
max_file_size_mb: 60

# /media/{token} 临时链接有效期（分钟）
expiry_minutes: 30

# 同一聊天两次处理的最小间隔（秒）
cooldown_seconds: 3

# 小红书兜底用的 yt-dlp（yt-dlp 会被重定向到登录页时用）
yt_dlp_path: "/usr/local/bin/yt-dlp"

# 本地解析器
resolver_enabled: true
# 自己生成一串足够长的随机字符，解析器 config.json 用同一个
resolver_token: "CHANGE_ME_to_a_long_random_string"
resolver_timeout: 120
resolver_stale_seconds: 60

# 合并转发超时（大视频上传慢）
send_timeout: 300

# 图文笔记最多发送张数（1~20）
max_images: 9

# B 站视频体积上限（MB）：B 站视频通常更大，单独设一个上限
bilibili_max_size_mb: 300

# B 站登录态（可选）：填浏览器里 bilibili.com 的 SESSDATA
# 留空 = 匿名，只能拿 720p；填了才能拿到 1080p / 会员视频（DASH + ffmpeg 合并）
bilibili_cookie: ""

# 合并 DASH 音视频用的 ffmpeg（留空自动查找）
bilibili_ffmpeg_path: ""

# X (Twitter) 帖子解析：读 X 嵌入组件的公开数据接口，不需要登录 / API token / 本地解析器
# 只能读公开的单条帖子；受保护、已删除、需登录的帖子会提示无法解析
x_enabled: true

# X 视频体积上限（MB）：自动挑不超过上限的最高码率 mp4，全部超限则不发并提示实际大小
x_max_size_mb: 100

# 合并转发里在图片 / 视频前面附上作者、北京时间、正文和被引用帖子正文
# 关闭后只发图片 / 视频；纯文字帖子在关闭时会提示没有可发送的内容
x_send_text: true

# 文字里是否带上点赞 / 回复数（仅 x_send_text 为 true 时有效）
x_show_stats: true

# Instagram 帖子解析：匿名读公开帖子页（不登录、不用 Cookie / token），非官方接口，可能随时失效
# 支持 /p/ /reel/ /reels/ /tv/ 链接；Stories、私密账号、需登录的内容会提示无法解析
instagram_enabled: true

# Instagram 视频体积上限（MB）：单个视频超过则不发并提示实际大小
instagram_max_size_mb: 100

# 灰色做法（伪装成搜索引擎爬虫），默认开启，可设为 false 关闭：
# 总是先用诚实的 nekro-media-forward UA；只有它拿不到数据（Instagram 偶尔只返回空壳）时，才会再用 Googlebot 的 User-Agent 重试一次。
# 这可能不符合你所在地区 / Instagram 的使用条款，介意的话请改成 false（关闭后只用诚实 UA，失败就走 embed / yt-dlp / oEmbed 回退）
instagram_fallback_ua: true

# Facebook 帖子解析：匿名读公开帖子页（不登录、不用 Cookie / token），非官方接口，可能随时失效
# 支持 /<主页>/posts/<id>、/videos/<id>、/reel/<id>、/watch/?v=、/share/p|v|r/ 等；不支持 fb.watch 短链、群组帖、私密内容
facebook_enabled: true

# Facebook 视频体积上限（MB）：单个视频超过则不发并提示实际大小
facebook_max_size_mb: 100

# 文字里是否附上最多 5 条页面上能匿名看到的热门评论（默认不附）
facebook_send_comments: false

# Instagram / Facebook 代理（可选，做法同 x_proxy）。
# 留空 = 直连（和以前一样）。两个站在大陆机房大概率直连不通（作者没有在大陆网络下测过），需要时填各自的代理；
# 帖子页请求、图片 / 视频下载、yt-dlp 回退都会走它。容器里的 127.0.0.1 是容器自己，要填宿主机在 docker 网桥上的地址，例如：
# instagram_proxy: "http://172.18.0.1:7891"
instagram_proxy: ""
facebook_proxy: ""

# NapCat 与解析器同一台机器时设为 true（TikTok 走本机路径直传，零中转）
# NapCat 在云端时保持 false（改由解析器上传文件）
allow_resolver_local_path: false

# 合并转发卡片里显示的昵称（发送者账号自动取 bot.self_id）
forward_nickname: "机器人"
# X / Twitter 代理（可选）。
# X 在大陆机房无法直连，必须走代理才能读取帖子和下载媒体。
# 注意：容器里的 127.0.0.1 是容器自己，要填宿主机在 docker 网桥上的地址，例如：
# x_proxy: "http://172.18.0.1:7891"
x_proxy: ""

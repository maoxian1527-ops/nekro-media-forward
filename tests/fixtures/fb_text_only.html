<!DOCTYPE html><html><head><title>Facebook</title></head><body><script type="application/json" data-content-len="1" data-sjs>{"require": [["ScheduledServerJS", "handle", null, [{"__bbox": {"require": [["RelayPrefetchedStreamCache", "next", [], ["adp_CometSinglePostContentQueryRelayPreloader", {"__bbox": {"complete": true, "result": {"data": {"node": {"__typename": "Story", "post_id": "10118105240759181", "creation_time": 1792615943, "permalink_url": "https://www.facebook.com/zuck/posts/pfbid0EEdDQVai4umZQwLkvGmFZnAnAucg4GMRLrphVp2SYyCUfBmtL9gmAzap22uA2jscl", "actors": [{"name": "Mark Zuckerberg", "id": "4"}], "attachments": [], "comet_sections": {"content": {"story": {"comet_sections": {"message": {"story": {"message": {"text": "I just shared Meta's quarterly earnings report. We launched Muse and shipped Muse Wonder, our first frontier model. Our investments are delivering results, our core business is strong, and we're moving fast to bring personal superintelligence to everyone. Here's the transcript of what I said on the call:\n\nThis has been a busy and exciting few months. Our family of apps is now used by 3.64 billion people each day, and we're seeing all-time highs in engagement on both Facebook and Instagram driven by strong growth in video. Threads has now overtaken X in monthly actives and continues to grow quickly. WhatsApp is hitting all-time highs in messaging and is becoming an increasingly important platform for agents as well. \n\nIn the last few months we have had several major milestones towards our goal of delivering personal superintelligence to everyone. We had one of our most successful launches ever with the Muse personal agent; we shipped Muse Wonder as our first frontier model; and we shipped several new glasses and gadgets with Muse integration, including coming soon to our new audio glasses.\n\nWe have been discussing our vision for personal superintelligence for more than a year now. We want every person have an extremely capable personal agent that understands your goals and can help you achieve them and improve your life in whatever ways you want -- whether that's improving your relationships, helping you save time, save money, build a business, create new things, or anything else that you can dream of. Muse is the product form of this vision. So now we have the foundational technology in place to deliver this. There is still a lot of work ahead, but our initial position is very strong:\n\nIn just a month and a half, more than 10 million people in the US and Canada have set up Muse personal agents. Growth continues to be strong and we have been #1 in the App Store almost every day. Engagement and retention are also off to a strong start. About 25% of people who have set up Muse use it on any given day. For our earliest adopters, the longer that they use Muse, the better retention seems to get. To put this in perspective, this is more than twice the level that Threads started at or where we believe that other AI apps started as well.\n\nThe most common use case for Muse is shopping, with more than a quarter of people who are using Muse engaging in this with an average purchase size over $200. Plaid told us they hadn't seen activity like they're seeing with their connector on any other service before. In the first week we had to work with Stripe to raise credit limits since the volumes were above what any of us expected.\n\nBeyond shopping, the most common connectors are for personal productivity and connecting Muse to your other services like email and calendar. This shows the importance of the Muse Secure VM that we've built to provide state-of-the-art privacy and security, and we're looking forward to following up soon with the Muse Confidential VM, which will make it so that even Meta cannot see your content.\n\nWe have also seen that Muse Wonder improves quality, engagement, and retention further, which suggests that as we continue to improve intelligence, Muse will perform better and better over time.\n\nNow that Muse has clear product-market fit, we are entering a new phase and a more operational phase that is focused on scaling. The goals for this next phase play to many of Meta's strengths. We need to do three things: scale the product, grow revenue, and optimize compute costs. \n\nWe expect to grow Muse to serve billions of people. This is both our mission and our strategy. It's our mission in that we believe in putting the power of personal superintelligence in everyone's hands. We believe that that is the path to ensuring a positive future for everyone with individual empowerment as the source of prosperity and balance of power as the foundation for safety. On a values level, we believe that delivering this capability widely is the best thing that we can be doing. This is also our strategy, because we think that billions of Muses in a network at scale will be able to get more done for people and businesses by working together. So we'd like to create a large scale Muse network as quickly as possible.\n\nFrom a business perspective, the average revenue per American user for our existing Family of Apps users is several hundreds of dollars annually, and we expect Muse will reach an even higher level over time due to the amount of commerce that we already see taking place. This will take some time, but we're starting to work on this now. Our business model will have a few components:\n\n• For most people, the product should be free and we will build commerce tools so we get paid a fee based on the transactions that we help facilitate. We expect that this will be paid for by businesses. \n\n• For people who want the most advanced models or to use extra tokens, they subscribe directly and pay.\n\n• For business owners who want additional features to use Muse to grow their businesses or for companies that want people to use Muse for work, they will be able to subscribe directly and pay as well.\n\n• And for those who want Muse to help improve the personalization and quality of their content and ads across Meta, they will be able to connect to those experiences as well.\n\nThe average revenue I was talking about before is the Family of Apps revenue for existing Muse users. \n\nOn the compute side, we are building out the capacity to serve more than a billion people over the next few years. In the near term, Muse is very compute-intensive to run. But we expect to improve its cost efficiency by more than 10x in the next year, which will enable it to be profitable once the revenue lines are at scale. If compute efficiency continues improving quickly for another few years, which we think is highly likely, then Muse will be highly profitable over multiple years. In the near term, the strength of our core business enables us to scale the Muse network before then. And we believe we are the best positioned company to pursue this strategy.\n\nOne other note on compute economics is that since training is a large fixed cost, now that we have leading models, we want to serve as much high-margin inference demand as possible. That is why we are building the Meta Enterprise Platform, led by CJ Desai. Muse Wonder and even more advanced models that we are training can serve additional high-margin services beyond the Muse network, including our API, Muse Code, and other enterprise services.\n\nA fundamental feature of our business is that we have many good uses for this compute. It is difficult to forecast the exact growth rates for the Muse network, for our enterprise platform, and for how Muse Wonder and beyond will accelerate our core business. But through building out multiple ways to deploy these advanced models, we increase the chances that one or more of them significantly outperforms our expectations. Beyond serving other businesses, we have not yet found the limit of how effectively we can apply compute to accelerating our own core business. We have implemented an eval with Muse Wonder to improve how effectively it can autonomously improve our recommendations and ads systems. And as our upcoming models get even more advanced, I expect that we're going to see an increasing rate of improvement in these systems.\n\nAlright let's talk about the models now. Muse Wonder is state-of-the-art across most dimensions that matter for personal superintelligence. This validates the importance of training models ourselves to deliver the best experience. In addition to Muse, we've also seen that engagement per person in Meta AI has more than doubled since April when we started rolling out our new models.\n\nWhile Muse Wonder has been our most important release, I've been very pleased with our pace of execution here. In the last few months we've shipped Muse Spark 1.2 and 1.3, Muse Code, two open weights models with Muse Glimmer and Muse Spark Open, and also Muse Voice. \n\nGoing forward, with the field advancing quickly, we plan to focus on both pushing the frontier of intelligence and distilling those models into much smaller and more efficient product models that will be optimized for personal agents. My view is that we will be able to build superintelligence through scaling, so we are methodically working our way up the ladder there. We are already working on larger models after Muse Wonder, and they're going to be very impressive and capable. We are also working on new smaller models coming out soon that deliver Muse Wonder-level intelligence more efficiently.\n\nMoving on, our work on personal superintelligence is now also the focus of Reality Labs. Muse is coming to Meta Glasses starting next month, and that will be an important step towards this. People already love many features of the glasses -- music, calling, capturing moments, hearing assistance, and more -- but over time we expect Muse and having your personal superintelligence with you throughout the day will be the most important part of the experience.\n\nMuse is also central to the business model for the glasses. Again, our mission and strategy are to serve everyone here. We believe in putting the power of this technology in everyone's hands. So we have priced our devices not to make a large profit on the hardware, but to build a large software and superintelligence business on top of them over time. Glasses sales continue to grow rapidly and now with Muse, we expect paid subscriptions to increase and this business to begin improving meaningfully from here.\n\nI also shared at Connect that we are changing our approach to virtual reality to only ship new devices when we have major breakthroughs like we had with the Meta VR Glasses this year -- which are of course the first VR experience ever in a pair of glasses. I continue to believe that the path to delivering the holographic experience of bringing together the physical and digital worlds in everyday glasses will come through VR first, but we will pace this aspect of our investment more to focus on delivering personal superintelligence first. \n\nSo with these factors combined, we expect the P&L of Reality Labs to improve from here, with operating loss coming down to around $15B next year and trending towards profitability from there.\n\nBefore we conclude, I want to spend a moment on the sheer velocity that we are seeing. An important part of our approach has always been to move fast so we can learn quickly and serve people better at scale. But recently things have accelerated. In the last year, we shipped Edits and it has already passed 50 million actives. New apps like Forum and Seller were built by small teams and are scaling quickly to serve power users. Muse went from an idea on a whiteboard to a successful product in just about eight months. And we're about to ship Muse Charm, which will have gone from concept to a hardware device in people's pockets in less than a year.\n\nI'm proud of what we're building. People have all kinds of different opinions about the future, but at Meta we believe that the future is for everyone and that putting power in people's hands is how we get there. I think that this matters. There needs to be a company out there that represents these ideas. But this isn't just about ideas; it's also about execution. So I'm grateful for everyone who is working so hard to deliver this to billions of people around the world. And as always, thank you to everyone who is on this journey with us."}}}}}}, "feedback": {"story": {"story_ufi_container": {"story": {"feedback_context": {"feedback_target_with_context": {"comet_ufi_summary_and_actions_renderer": {"feedback": {"i18n_reaction_count": "67730", "reaction_count": {"count": 67730}, "share_count": {"count": 2535}, "comments": {"total_count": 14544}}}}}}}}}}}}}}}]]]}}]]]}</script></body></html>
